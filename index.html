<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="EduManage — a simple school management app to manage students, teachers, and classes." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>EduManage — School Management</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon/launchericon-48x48.png" />
<link rel="apple-touch-icon" href="icon/launchericon-192x192.png"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">🎓</span>
        <div>
          <strong>EduManage</strong>
          <small>School Management</small>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-link active" data-view="dashboard"><span>📊</span> Dashboard</button>
        <button class="nav-link" data-view="students"><span>👩‍🎓</span> Students</button>
        <button class="nav-link" data-view="teachers"><span>👩‍🏫</span> Teachers</button>
        <button class="nav-link" data-view="classes"><span>🏫</span> Classes</button>
      </nav>

      <div class="sidebar-footer">
        <p>All data is saved on this device.</p>
        <button class="btn ghost small" id="resetBtn">Reset sample data</button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- ========== MAIN ========== -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <button class="btn primary" id="primaryBtn">+ Add Student</button>
      </header>

      <main class="content" id="content"><!-- rendered by JS --></main>
    </div>

  </div>

  <!-- ========== MODAL ========== -->
  <div class="modal-backdrop" id="modalBackdrop">
    <form id="recordForm" class="modal" novalidate>
      <div class="modal-header">
        <h2 id="modalTitle">Add Student</h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"><!-- fields rendered by JS --></div>
      <div class="modal-footer">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
